{% load unfold %}

{% if kpis %}
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mb-6">
    {% for kpi in kpis %}
        <a href="{{ kpi.url }}" class="bg-white flex items-center gap-3 p-4 rounded-default border border-base-200 shadow-xs transition-all hover:border-base-300 hover:shadow-md dark:bg-base-900 dark:border-base-800 dark:hover:border-base-700">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full {% if kpi.alert %}bg-red-50 dark:bg-red-950{% else %}bg-primary-50 dark:bg-primary-950{% endif %}">
                <span class="material-symbols-outlined {% if kpi.alert %}text-red-600 dark:text-red-500{% else %}text-primary-600 dark:text-primary-500{% endif %}">{{ kpi.icon }}</span>
            </div>
            <div class="min-w-0">
                <div class="text-2xl font-semibold leading-tight text-important {% if kpi.alert %}text-red-600 dark:text-red-500{% endif %}">{{ kpi.value }}</div>
                <div class="text-xs text-subtle truncate">{{ kpi.title }}</div>
            </div>
        </a>
    {% endfor %}
</div>
{% endif %}

<div class="flex flex-col lg:flex-row gap-6">
    <div class="flex flex-col gap-5 grow">
        {% include "unfold/helpers/app_list_default.html" with show_changelinks=True %}
    </div>

    {% include "unfold/helpers/history.html" %}
</div>
