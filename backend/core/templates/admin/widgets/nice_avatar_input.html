<div class="mn-avatar-widget">
  <label class="mn-avatar-widget__circle{% if widget.is_initial %} mn-avatar-widget__circle--filled{% endif %}" for="{{ widget.attrs.id }}">
    {% if widget.is_initial %}
      <img src="{{ widget.value.url }}" alt="" class="mn-avatar-widget__img">
    {% else %}
      <svg class="mn-avatar-widget__placeholder" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
      </svg>
    {% endif %}
    <span class="mn-avatar-widget__edit-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4M12 4l-4 4M12 4l4 4" />
        <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
      </svg>
    </span>
    <input type="{{ widget.type }}" name="{{ widget.name }}" class="mn-avatar-widget__input"{% include "django/forms/widgets/attrs.html" %}>
  </label>
  <div class="mn-avatar-widget__meta">
    <span class="mn-avatar-widget__label">{% if widget.is_initial %}Photo uploaded{% else %}No photo yet{% endif %}</span>
    <span class="mn-avatar-widget__hint">Click the circle to {% if widget.is_initial %}replace{% else %}add{% endif %} a photo — JPG, PNG or WEBP, up to 5MB</span>
    {% if widget.is_initial and not widget.required %}
      <label class="mn-avatar-widget__remove">
        <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}>
        Remove photo
      </label>
    {% endif %}
  </div>
</div>
